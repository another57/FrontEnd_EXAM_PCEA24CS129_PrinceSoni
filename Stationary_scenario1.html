<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stationery Shop — Shopping Cart</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      background: #f5f6fa;
      color: #1f2937;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.75rem;
    }
    .offer-banner {
      background: #eef2ff;
      color: #3730a3;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.92rem;
      margin-bottom: 1.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 0.9rem 0.5rem;
      border-bottom: 1px solid #e5e7eb;
    }
    th {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b7280;
    }
    .qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .qty-btn:hover {
      background: #e5e7eb;
    }
    .qty-value {
      min-width: 24px;
      text-align: center;
      font-weight: 600;
    }
    .remove-btn {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .remove-btn:hover {
      background: #fecaca;
    }
    .empty-cart {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #6b7280;
    }
    .reset-btn {
      margin-top: 0.75rem;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .summary {
      margin-top: 1.5rem;
      margin-left: auto;
      max-width: 340px;
      background: #f9fafb;
      padding: 1.25rem;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      font-size: 0.95rem;
    }
    .discount-text {
      color: #15803d;
      font-weight: 600;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #d1d5db;
      padding-top: 0.75rem;
      margin-top: 0.75rem;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .checkout-btn {
      width: 100%;
      margin-top: 1rem;
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .checkout-btn:hover {
      background: #15803d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stationery Cart</h1>
    <div class="offer-banner">
      <strong>Special Offer:</strong> Get <strong>10% off</strong> when your subtotal is <strong>₹1,000 or more</strong>!
    </div>
    <div id="cart-container"></div>
  </div>

  <script>
    // Array of cart item objects with name, price, and qty
    const initialCart = [
      { name: "Notebook", price: 120, qty: 1 },
      { name: "Pen Pack", price: 60, qty: 1 },
      { name: "Water Bottle", price: 350, qty: 1 }
    ];

    let cartItems = initialCart.map(item => ({ ...item }));

    // 10% discount if subtotal is ₹1,000 or more
    function getDiscountRate(subtotal) {
      return subtotal >= 1000 ? 0.10 : 0;
    }

    function updateQty(index, delta) {
      const nextQty = cartItems[index].qty + delta;
      if (nextQty <= 0) {
        removeItem(index);
        return;
      }
      cartItems[index].qty = nextQty;
      renderCart();
    }

    function removeItem(index) {
      cartItems.splice(index, 1);
      renderCart();
    }

    function resetCart() {
      cartItems = initialCart.map(item => ({ ...item }));
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cart-container");

      if (cartItems.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <p>Your cart is currently empty.</p>
            <button class="reset-btn" onclick="resetCart()">Restore Sample Items</button>
          </div>
        `;
        return;
      }

      const subtotal = cartItems.reduce((sum, item) => sum + item.price * item.qty, 0);
      const discountRate = getDiscountRate(subtotal);
      const discountAmount = Math.round(subtotal * discountRate);
      const finalAmount = subtotal - discountAmount;

      const rowsHtml = cartItems
        .map((item, idx) => {
          const itemTotal = item.price * item.qty;
          return `
            <tr>
              <td><strong>${item.name}</strong></td>
              <td>₹${item.price}</td>
              <td>
                <div class="qty-controls">
                  <button class="qty-btn" onclick="updateQty(${idx}, -1)" aria-label="Decrease quantity">−</button>
                  <span class="qty-value">${item.qty}</span>
                  <button class="qty-btn" onclick="updateQty(${idx}, 1)" aria-label="Increase quantity">+</button>
                </div>
              </td>
              <td>₹${itemTotal}</td>
              <td>
                <button class="remove-btn" onclick="removeItem(${idx})">Remove</button>
              </td>
            </tr>
          `;
        })
        .join("");

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Item Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>

        <div class="summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <span>₹${subtotal}</span>
          </div>
          <div class="summary-row discount-text">
            <span>Discount (${Math.round(discountRate * 100)}%)</span>
            <span>−₹${discountAmount}</span>
          </div>
          <div class="total-row">
            <span>Final Amount</span>
            <span>₹${finalAmount}</span>
          </div>
          <button class="checkout-btn" onclick="alert('Order placed! Final Amount: ₹${finalAmount}')">
            Proceed to Checkout
          </button>
        </div>
      `;
    }

    renderCart();
  </script>
</body>
</html>
